name: Recover stuck HST workflow

on:
  push:
    paths:
      - ".github/workflows/recover-stuck-run.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stuck run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/37500129125/force-cancel"
