name: Deploy HST Alerta to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect HST sources
        env:
          HST_WPP_GRUPO_OPERACIONAL_TESTE: ${{ secrets.HST_WPP_GRUPO_OPERACIONAL_TESTE }}
          HST_WPP_ACCESS_TOKEN: ${{ secrets.HST_WPP_ACCESS_TOKEN }}
          HST_WPP_PHONE_NUMBER_ID: ${{ secrets.HST_WPP_PHONE_NUMBER_ID }}
          HST_WPP_TEMPLATE_NAME: ${{ secrets.HST_WPP_TEMPLATE_NAME }}
          HST_WPP_TEMPLATE_LANGUAGE: ${{ secrets.HST_WPP_TEMPLATE_LANGUAGE }}
          HST_WPP_GRAPH_VERSION: ${{ secrets.HST_WPP_GRAPH_VERSION }}
          HST_WPP_ENABLED: ${{ secrets.HST_WPP_ENABLED }}
        run: python scripts/collect_hst.py

      - name: Validate generated data
        run: |
          python scripts/validate_build.py
          node scripts/validate_frontend.mjs

      - name: Evaluate and send WhatsApp notification
        continue-on-error: true
        env:
          HST_WPP_GRUPO_OPERACIONAL_TESTE: ${{ secrets.HST_WPP_GRUPO_OPERACIONAL_TESTE }}
          HST_WPP_ACCESS_TOKEN: ${{ secrets.HST_WPP_ACCESS_TOKEN }}
          HST_WPP_PHONE_NUMBER_ID: ${{ secrets.HST_WPP_PHONE_NUMBER_ID }}
          HST_WPP_TEMPLATE_NAME: ${{ secrets.HST_WPP_TEMPLATE_NAME }}
          HST_WPP_TEMPLATE_LANGUAGE: ${{ secrets.HST_WPP_TEMPLATE_LANGUAGE }}
          HST_WPP_GRAPH_VERSION: ${{ secrets.HST_WPP_GRAPH_VERSION }}
          HST_WPP_ENABLED: ${{ secrets.HST_WPP_ENABLED }}
        run: python scripts/send_whatsapp.py

      - name: Persist monitoring history
        run: |
          git config user.name "hst-alerta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/status.json data/history.json data/history_index.json data/climate_history.json data/notification_state.json data/archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): registra snapshot HST [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
